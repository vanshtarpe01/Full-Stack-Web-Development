<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Html Form</title>
</head>

<body>

    <h1>Login Form</h1>
    <form></form>
    <fieldset>
        <legend>Basic Infromation</legend>
        <label for="username">Username : </label>
        <input type="text" id="username" name="usernamefield" placeholder="Enter your email id">
        <br />
        <br />
        <label for="password">Password : </label>
        <input type="password" id="password" name="passwordfield" placeholder="Enter your password">
        <br />
        <br />
        <label for="choosedate">DOB : </label>
        <input type="date" id="choosedate" name="datefield">
        <br />
        <br />
        <label for="selectprogramminglang">Select Programming Langauges :</label>
        <select name="programmingLangauges" id="selectprogramminglang" multiple="multiple">
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="js">JavaScript</option>
            <option value="c++">C++</option>
            <option value="c">C</option>
        </select>
        <br />
        <br />
        <label for="selectstate">Select State :</label>
        <select name="state" id="selectstate">
            <option value="ka">Karnataka</option>
            <option value="ap">Andhra Pradesh</option>
            <option value="tn">Tamil Nadu</option>
            <option value="dl">Delhi</option>
            <option value="mh">Maharashtra</option>
        </select>
        <br />
        <br />

        <label>Choose your Gender</label>
        <br />
        <form>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="male">Female</label>
            <input type="radio" name="gender" id="other">
            <label for="male">Prefer not to say</label>
        </form>
        <br />
        <br />

        <label for="languages">Languages Known (English, Marathi, Hindi)</label>
        <br />
        <input type="checkbox" name="english" id="english" value="English">
        <label for="english">English</label>
        <input type="checkbox" name="marathi" id="marathi" value="Marathi">
        <label for="marathi">Marathi</label>
        <input type="checkbox" name="hindi" id="hindi" value="Hindi">
        <label for="hindi">Hindi</label>
        <br />
        <br />

        <label for="aboutyou">About You :</label>
        <textarea name="aboutyou" id="aboutyou" cols="30" rows="10" placeholder="Describe yourself here..."></textarea>
        <br />
        <br />
        <label for="choosefile">Choose File : </label>
        <input type="file" name="choosefile" id="choosefile" placeholder="choose">
        <br/>
        <br/>
        <input type="submit" value="Login">
