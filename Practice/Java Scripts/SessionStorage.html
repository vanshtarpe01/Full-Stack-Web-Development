<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Storage In JS</title>
    <style>

    </style>
</head>

<body>

    <script>
        // Store user login status using sessionStorage.
        sessionStorage.setItem("username", "Vansh_15");
        sessionStorage.setItem("pass", "Vansh@123");
        let username = sessionStorage.getItem("username");
        let pass = sessionStorage.getItem("pass");
        console.log(username);
        console.log(pass);

        // Copy data from sessionStorage to localStorage.
        localStorage =sessionStorage; 

        //    Remove a single item from sessionStorage.
        sessionStorage.setItem("age", 19);
        console.log(sessionStorage);
        sessionStorage.removeItem("age");
        console.log(sessionStorage);

        // Clear session data on logout.
        sessionStorage.clear();
    </script>
</body>

</html>
