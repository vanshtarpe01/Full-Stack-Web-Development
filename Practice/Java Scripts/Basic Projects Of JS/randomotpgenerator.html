<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random OTP Generator</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            height: 100dvh;
        }
        h1{
            margin-top: 50px;
            color: #333;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #ae7827;
            border: none;
            border-radius: 5px;
            color: white;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover{
            background-color: #cc9a2e;
        }
        #otp{
            margin-top: 20px;
            font-size: 20px;
            border: 1px solid #ccc;
            width: 300px;
            padding: 20px;
            margin: 20px auto;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>

<body>
    <h1>OTP Generator</h1>
    <div id="otp"></div>
    <button onclick="generateOTP()">Generate OTP</button>
    <script>
        function generateOTP(length = 4) {
            let otp = "";
            for (let i = 0; i < length; i++) {
                const random = Math.floor(Math.random() * 10);
                otp += random;
            }
            document.querySelector("#otp").textContent = otp;
        }
    </script>
</body>

</html>
