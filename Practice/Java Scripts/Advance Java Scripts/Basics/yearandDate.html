<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date, Month and Years in Js</title>
</head>
<body>

<script>
    // Create a Date object for current date and time
    const days = new Date();
    console.log(days); // Full current date & time

    // ----- Date & Time methods -----

    console.log(days.getFullYear()); // Current year (e.g. 2026)

    console.log(days.getMonth()); 
    // Month index (0–11)
    // 0 = January, 6 = July, 11 = December

    console.log(days.getDate()); // Day of the month (1–31)

    console.log(days.getDay()); 
    // Day of the week (0–6)
    // 0 = Sunday, 1 = Monday, etc.

    console.log(days.getHours()); // Current hour (0–23)
    console.log(days.getMinutes()); // Current minutes
    console.log(days.getSeconds()); // Current seconds
    console.log(days.getMilliseconds()); // Current milliseconds

    // ----- String methods -----

    console.log(days.toDateString());   // Example: "Mon Jan 11 2026"
    console.log(days.toTimeString());   // Example: "14:30:25 GMT+0530"
    console.log(days.toLocaleString()); // Local date & time format

    // Create a past date
    const past = new Date("July 1 2025 11:30:28");

    // Difference between current time and past time (in milliseconds)
    const differ = days.getTime() - past.getTime();
    console.log(differ);

    // Convert milliseconds → minutes
    const mins = Math.round(differ / 1000 / 60);

    // Convert minutes → hours
    const hours = Math.round(mins / 60);

    // Convert hours → days
    const dayss = Math.round(hours / 24);

    console.log(mins + " minutes");
    console.log(hours + " hours");
    console.log(dayss + " days");
</script>

</body>
</html>
