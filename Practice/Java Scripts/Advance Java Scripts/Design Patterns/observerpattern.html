<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observer Pattern</title>
</head>
<body>
    

    <script>
        // One object (Subject) notifies multiple objects (Observers) when its state changes.
        // It’s used everywhere in JavaScript:
        // Event listeners
        // React state updates
        // Pub/Sub systems
        // Notification

        // Core Concepts
        // Subject → Keeps a list of observers
        // Observer → Gets notified when something changes
        // Notify → Subject informs all observers

        // Real-Life Example
        // YouTube Channel
        // Channel = Subject
        // Subscribers = Observers
        // New video uploaded → All subscribers get notified

        class YoutubeChannel{
            constructor(){
                this.subscribers = [];
            }

            subscribe(user){
                this.subscribers.push(user);
                user.update(`${user.name}, You have subscribed the channel.`);
            }
            unsubscribe(user){
                this.subscribers = this.subscribers.filter((sub)=> sub != user);
                user.update(`${user.name}, You have unsubscribed the channel.`)
            }
            notify(message){
                this.subscribers.forEach((sub) => sub.update(message));
            }
        }

        class User{ 
            constructor(name){
                this.name = name;
            }
            update(data){
                console.log(`${this.name}, ${data}`);
            }
        }

        let adminVansh = new YoutubeChannel();
        let user1 = new User("Vansh");
        let user2 = new User("Amit");

        adminVansh.subscribe(user1);
        adminVansh.subscribe(user2);

        adminVansh.notify("New Video Uploaded..");
        // user1

    </script> 
</body>
</html>
