<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading using Observer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Space between images */
        .spacer {
            height: 600px;
        }

        /* Image styling */
        .lazy-img {
            display: block;
            width: 100%;
            height: auto;
            margin: 30px 0;
            background: #eee;
            opacity: 0;
            transition: opacity 0.5s ease;
            /* Placeholder background */
        }

        .lazy-img.loaded {
            opacity: 1;
        }
    </style>

</head>

<body>
    <h2 style="text-align:center;">Lazy Loading Images</h2>

    <!-- Image with data-src instead of src -->
    <img data-src="https://picsum.photos/id/1011/300/200" class="lazy-img" alt="Image 1">

    <div class="spacer"></div>

    <img data-src="https://picsum.photos/id/1015/300/200" class="lazy-img" alt="Image 2">

    <div class="spacer"></div>

    <img data-src="https://picsum.photos/id/1016/300/200" class="lazy-img" alt="Image 3">

    <div class="spacer"></div>

    <img data-src="https://picsum.photos/id/1020/300/200" class="lazy-img" alt="Image 4">


    <script>

        let images = document.querySelectorAll("img");

        const observer = new IntersectionObserver(
            function (entries, observer) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.add("loaded");
                        observer.unobserve(img);
                    }
                });

            }, {
            root: null,
            threshold: 0.1
        }
        );


        images.forEach((img) => {
            observer.observe(img);
        });

    </script>

</body>

</html>
