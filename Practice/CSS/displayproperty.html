<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* div{
            border: 1px solid red;
            width: 300px;
            height: 300px;
            padding: 10px;
            margin: 10px;
        } */

        .box {
            border: 1px solid black;
            width: 300px;
            height: 300px;
            padding: 10px;
            margin: 20px 0px 0px 20px;
            display: inline-block;
        }

        span {
            border: 1px solid red;
            width: 300px;
            height: 300px;
            padding: 10px;
            margin: 20px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <!-- <div>Welcome to Html</div>
    <div>Welcome to Html 2.0</div> -->
    <div class="box">This is for Box Sizing Broder Box</div>

    <span>Hello Mr Developer</span>
    <span>What's today ageanda..</span>
</body>

</html>
