<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h2 id="header-title">CraftMyThoughts</h2>
            <p id="header-desc1">Personal reflections and practical insights in one place.</p>
            <p id="header-desc2">Simple, honest, and engaging content for curious minds.</p>
        </header>
        <div class="card-container">
            <div class="cards">
                <div>
                    <img src="gadgets.jpg" alt="Gadegts" class="cardimage">
                </div>
                <div class="card-details">
                    <h2 class="card-title">New Gadgets Released</h2>
                    <p class="card-desc">Check out the latest tech gadgets hitting the market, from smartphones to smartwatches</p>
                </div>
                <div class="card-other-details">
                    <div class="image-name">
                        <div class="card_image_container">
                            <img src="person-male.jpg" alt="Image" class="person-image">
                        </div>
                        <div class="date-name">
                            <span class="colorblack">John Doe</span>
                            <span class="dgray">Sept 19, 2024</span>
                        </div>
                    </div>
                    <div>
                        <span class="tag">Technology</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
