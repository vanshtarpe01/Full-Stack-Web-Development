<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Designing Exercise 1</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
        }

        .innercontainer {
            height: 530px;
            width: 320px;
            /* border: 1px solid rgb(163, 163, 163); */
            box-shadow: 2px 2px 4px 1px rgb(163, 163, 163), -2px -2px 6px 1px rgb(163, 163, 163);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 20px;
        }

        #Image {
            width: 300px;
            height: 280px;
            padding: 0px 10px;
            padding-bottom: 8px;
            border-radius: 28px;
            object-fit: cover;
        }

        #heading {
            padding: 12px;
            font-size: 20px;
        }

        #para {
            padding: 10px 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="innercontainer">
            <img src="img1.jpg" alt="Image" id="Image">
            <h2 id="heading">Improve your front end skills buy developing projects</h2>
            <p id="para">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sint dolorem expedita architecto
                eligendi nobis quos aspernatur fugiat quo culpa possimus excepturi ipsa repudiandae sit perspiciatis ab
                ex, laborum aliquid minima!</p>
        </div>
    </div>
</body>

</html>
