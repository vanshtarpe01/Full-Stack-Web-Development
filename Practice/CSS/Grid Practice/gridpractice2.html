<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practice Example 2</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
        }
        .container{
            width: 100vw;
            height:100vh;
            background-color: rgb(1, 1, 44);
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2,1fr);
            padding: 2rem;
        }
        .boxes{
            background-color: yellowgreen;
        }
        .box1{
            grid-column-start: 1;
            grid-column-end: 3;
        }
        .box2{
            grid-column-start: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="boxes box1"></div>
        <div class="boxes box2"></div>
        <div class="boxes box3"></div>
        <div class="boxes box4"></div>
    </div>
</body>
</html>
