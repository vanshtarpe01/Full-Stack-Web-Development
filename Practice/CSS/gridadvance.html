<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Basic to Advance</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%s;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: rgb(87, 87, 87);
            display: grid;
            gap: 0.4rem;
            grid-template-columns: repeat(1,1fr);
            grid-template-rows: repeat(4, 200px);
            padding: 4rem;

            /* justify-items: center; */
            /* justify-items: end; */
            /* align-items: center; */
            /* align-items: end; */
            /* Mixture of justify and align-items */
            /* place-items: center; */
        }
        .items{
            height: 100px;
            width: 100px;
            background-color: rgb(5, 68, 68);
            border: 2px solid rgb(202, 189, 189);
            /* justify-self: stretch;
            align-self: stretch; */

            /* justify-self: center;
            align-self: center; */
            /* Mixture of align,justif-self */
            place-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">A</div>
        <div class="items">B</div>
        <div class="items">C</div>
        <div class="items">D</div>
    </div>
</body>
</html>
