<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Designing Exercise 2</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffdeed;
            background: radial-gradient(circle, rgba(255, 222, 237, 1) 0%, rgba(251, 255, 212, 1) 100%);
        }

        .innercontainer {
            width: 340px;
            height: 500px;
            border-radius: 20px;
            box-shadow: 2px 2px 8px 1px rgb(216, 216, 216), -2px -2px 8px 1px rgb(216, 216, 216);
            background-color: white;
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        #image {
            border-radius: 20px 20px 0px 0px;
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .details-container{
            width: 80%;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #desc{
            text-align: center;
        }
        .plan{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(224, 224, 224);
            border-radius: 8px;
            padding: 10px 20px;
            width: 100%;
        }
        .annual{
            display: flex;
            gap: 10px;
        }
        #imgannual{
            width: 22px;
            height: 22px;
            margin-top: 8px;
        }
        .annualplan{
            display: flex;
            flex-direction: column;
        }
        #btn-ptop{
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgb(0, 0, 61);
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0px 6px 16px 1px rgba(2, 9, 70, 0.418);
            color: white;
            cursor: pointer;
        }
        #cancel-order-txt{
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="innercontainer">
            <img src="img2.jpg" alt="Image" id="image">
            <div class="details-container">
                <h2 id="title">Order Summary</h2>
                <p id="desc">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Non debitis accusamus atque animi voluptates
                    dolorem minus harum, sapiente tempore hic.</p>
                <div class="plan">
                    <div class="annual">
                        <img src="Project2/Resources/favi-icon.webp" alt="Img" id="imgannual">
                        <div class="annualplan">
                            <p>Annual Plan</p>
                            <p>$99.9/year</p>
                        </div>
                    </div>
                    <a href="#">Change</a>
                </div>
                <button id="btn-ptop">Proceed to Payment</button>
                <a href="#" id="cancel-order-txt">Cancel Order</a>
            </div>
        </div>
    </div>
</body>

</html>
